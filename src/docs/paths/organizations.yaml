getOrganizations:
  get:
    summary: Get user's organizations
    description: Returns all organizations that the authenticated user belongs to.
    tags:
      - Organizations
    security:
      - cookieAuth: []

    responses:
      "200":
        description: Organizations retrieved successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        example: clx123abc456
                      name:
                        type: string
                        example: My Organization
                      createdAt:
                        type: string
                        format: date-time
                        example: "2026-08-13T10:30:00.000Z"

      "401":
        description: Unauthorized. Authentication is required.

createOrganization:
  post:
    summary: Create an organization
    description: Creates a new organization for the authenticated user.
    tags:
      - Organizations
    security:
      - cookieAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                example: My Organization

    responses:
      "201":
        description: Organization created successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      example: clx123abc456
                    name:
                      type: string
                      example: My Organization

      "400":
        description: Invalid request body.

      "401":
        description: Unauthorized. Authentication is required.

getOrganization:
  get:
    summary: Get organization by ID
    description: Returns details of a specific organization.
    tags:
      - Organizations
    security:
      - cookieAuth: []

    parameters:
      - in: path
        name: orgId
        required: true
        description: The ID of the organization.
        schema:
          type: string
        example: clx123abc456

    responses:
      "200":
        description: Organization retrieved successfully.

      "400":
        description: Invalid organization ID.

      "401":
        description: Unauthorized. Authentication is required.

      "403":
        description: User does not have access to this organization.

      "404":
        description: Organization not found.

updateOrganization:
  patch:
    summary: Update an organization
    description: Updates the name of an organization.
    tags:
      - Organizations
    security:
      - cookieAuth: []

    parameters:
      - in: path
        name: orgId
        required: true
        description: The ID of the organization to update.
        schema:
          type: string
        example: clx123abc456

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                example: Updated Organization Name

    responses:
      "200":
        description: Organization updated successfully.

      "400":
        description: Invalid organization ID or request body.

      "401":
        description: Unauthorized. Authentication is required.

      "403":
        description: User is not authorized to update this organization.

      "404":
        description: Organization not found.

deleteOrganization:
  delete:
    summary: Delete an organization
    description: Deletes an organization. Only an authorized user can perform this operation.
    tags:
      - Organizations
    security:
      - cookieAuth: []

    parameters:
      - in: path
        name: orgId
        required: true
        description: The ID of the organization to delete.
        schema:
          type: string
        example: clx123abc456

    responses:
      "200":
        description: Organization deleted successfully.

      "400":
        description: Invalid organization ID.

      "401":
        description: Unauthorized. Authentication is required.

      "403":
        description: User is not authorized to delete this organization.

      "404":
        description: Organization not found.
