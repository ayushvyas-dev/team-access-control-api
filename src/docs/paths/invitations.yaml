      - Invitations
    security:
      - cookieAuth: []

    parameters:
      - in: path
        name: organizationId
        required: true
        description: The ID of the organization.
        schema:
          type: string
        example: clx789org123

    responses:
      "200":
        description: Invitations retrieved successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Invitations retrieved successfully
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        example: clx123abc456
                      organizationId:
                        type: string
                        example: clx789org123
                      email:
                        type: string
                        format: email
                        example: ayush@example.com
                      role:
                        type: string
                        example: MEMBER
                      status:
                        type: string
                        example: PENDING
                      createdAt:
                        type: string
                        format: date-time
                        example: "2026-08-20T10:30:00.000Z"
                      expiresAt:
                        type: string
