getUserInvitations:
  get:
    summary: Get user's invitations
    description: Returns all invitations received by the currently authenticated user.
    tags:
      - Invitations
    security:
      - cookieAuth: []

    responses:
      "200":
        description: User invitations retrieved successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: User invitations retrieved successfully
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        example: clx123abc456
                      organizationId:
                        type: string
                        example: clx789org123
                      email:
                        type: string
                        format: email
                        example: ayush@example.com
                      role:
                        type: string
                        example: MEMBER
                      status:
                        type: string
                        example: PENDING
                      createdAt:
                        type: string
                        format: date-time
                        example: "2026-08-20T10:30:00.000Z"
                      expiresAt:
                        type: string
                        format: date-time
                        example: "2026-08-27T10:30:00.000Z"

      "401":
        description: Unauthorized. Authentication is required.

createInvitation:
  post:
    summary: Create an invitation
    description: Creates an invitation for a user to join an organization.
    tags:
      - Invitations
    security:
      - cookieAuth: []

    parameters:
      - in: path
        name: organizationId
        required: true
        description: The ID of the organization.
        schema:
          type: string
        example: clx789org123

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - role
            properties:
              email:
                type: string
                format: email
                example: ayush@example.com
              role:
                type: string
                example: MEMBER

    responses:
      "201":
        description: Invitation created successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Invitation created successfully
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      example: clx123abc456
                    organizationId:
                      type: string
                      example: clx789org123
                    email:
                      type: string
                      format: email
                      example: ayush@example.com
                    role:
                      type: string
                      example: MEMBER
                    status:
                      type: string
                      example: PENDING
                    createdAt:
                      type: string
                      format: date-time
                      example: "2026-08-20T10:30:00.000Z"
                    expiresAt:
                      type: string
                      format: date-time
                      example: "2026-08-27T10:30:00.000Z"

      "400":
        description: Invalid request body.

      "401":
        description: Unauthorized. Authentication is required.

      "403":
        description: User is not authorized to create invitations.

      "404":
        description: Organization not found.

