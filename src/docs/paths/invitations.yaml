deleteInvitation:
  delete:
    summary: Delete an invitation
    description: Deletes an invitation from an organization.
    tags:
      - Invitations
    security:
      - cookieAuth: []

    parameters:
      - in: path
        name: organizationId
        required: true
        description: The ID of the organization.
        schema:
          type: string
        example: clx789org123

      - in: path
        name: invitationId
        required: true
        description: The ID of the invitation to delete.
        schema:
          type: string
        example: clx123abc456

    responses:
      "200":
        description: Invitation deleted successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Invitation deleted successfully

      "401":
        description: Unauthorized. Authentication is required.

      "403":
        description: User is not authorized to delete this invitation.

      "404":
        description: Invitation not found.

acceptInvitation:
  post:
    summary: Accept an invitation
    description: Accepts an organization invitation for the currently authenticated user.
    tags:
      - Invitations
    security:
      - cookieAuth: []

    parameters:
      - in: path
        name: invitationId
        required: true
        description: The ID of the invitation to accept.
        schema:
          type: string
        example: clx123abc456

    responses:
      "200":
        description: Invitation accepted successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Invitation accepted successfully

      "401":
        description: Unauthorized. Authentication is required.

      "404":
        description: Invitation not found.

      "409":
        description: Invitation cannot be accepted.

rejectInvitation:
  post:
    summary: Reject an invitation
    description: Rejects an organization invitation for the currently authenticated user.
    tags:
      - Invitations
    security:
      - cookieAuth: []

    parameters:
      - in: path
        name: invitationId
        required: true
        description: The ID of the invitation to reject.
        schema:
          type: string
        example: clx123abc456

    responses:
      "200":
        description: Invitation rejected successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Invitation rejected successfully

      "401":
        description: Unauthorized. Authentication is required.

      "404":
        description: Invitation not found.

      "409":
        description: Invitation cannot be rejected.
